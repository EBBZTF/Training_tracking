spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Tests run against in-memory H2 and let Hibernate build the schema (ddl-auto above). The
  # changelog is deliberately Postgres-only — partial indexes, BIGSERIAL, TIMESTAMPTZ — so it is
  # not applied here.
  liquibase:
    enabled: false

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  cors:
    allowed-origins: http://localhost:5500

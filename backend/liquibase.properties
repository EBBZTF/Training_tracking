# Only used by the liquibase-maven-plugin (`./mvnw liquibase:<goal>`), not by the running
# application — that reads the datasource from application.yml and the changelog from
# spring.liquibase.change-log.
#
# Defaults match docker-compose.yml; override on the command line for another database, e.g.
#   ./mvnw liquibase:changelogSync -Dliquibase.url=jdbc:postgresql://host:5432/db \
#          -Dliquibase.username=... -Dliquibase.password=...
changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml
url=jdbc:postgresql://localhost:5432/training_tracking
username=training
password=training
